[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qelearn"
version = "0.1.0"
description = "Interactive Quantum ESPRESSO Input Generator and Learning Tool"
authors = [
    { name = "Jauhar NR" },
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "textual>=0.38.0",
]

[project.scripts]
qelearn = "qelearn.main:run"

[tool.setuptools.packages.find]
where = ["src"]
